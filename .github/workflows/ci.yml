name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run security and leak-prevention scan
        run: git ls-files -z | xargs -0 ./scripts/pre-commit --files

      - name: Validate frontend ES module syntax and helper tests
        run: |
          for f in web/js/*.js; do
            node --input-type=module --check < "$f"
          done
          node --test tests/js/*.test.mjs
